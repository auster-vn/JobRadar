jobradar_analytics:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'jobradarvn') }}"
      password: "{{ env_var('DBT_PASSWORD', 'jobradarvn') }}"
      dbname: "{{ env_var('DBT_DATABASE', 'jobradarvn') }}"
      schema: analytics
      threads: 4
      connect_timeout: 10
    prod:
      type: postgres
      host: "{{ env_var('DBT_HOST') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      dbname: "{{ env_var('DBT_DATABASE') }}"
      schema: analytics
      threads: 8
      sslmode: require
