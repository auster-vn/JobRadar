[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobradarvn"
version = "0.1.0"
description = "Vietnamese technology job market intelligence platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "beautifulsoup4>=4.12,<5",
  "celery[redis]>=5.4,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "orjson>=3.10,<4",
  "pgvector>=0.3,<1",
  "prometheus-client>=0.21,<1",
  "pypdf>=5,<7",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "python-docx>=1.1,<2",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
nlp = ["spacy>=3.8,<4", "underthesea>=6.8,<7"]
ml = ["joblib>=1.4,<2", "mlflow>=2.19,<3", "numpy>=2,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2", "sentence-transformers>=3.3,<4", "torch>=2.5,<2.10", "xgboost-cpu>=2.1,<3; sys_platform == 'linux'", "xgboost>=2.1,<3; sys_platform != 'linux'"]
orchestration = ["prefect>=3,<4"]
analytics = ["dbt-postgres>=1.9,<2"]
scraping = ["playwright==1.61.0"]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "pre-commit>=4,<5",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "nlp", "scrapers", "workers", "ml", "flows"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and Redis services"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["workers.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["xgboost", "xgboost.*", "numpy", "numpy.*", "pandas", "pandas.*", "scipy", "scipy.*", "joblib", "joblib.*", "sklearn", "sklearn.*", "mlflow", "mlflow.*", "prefect", "prefect.*", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
