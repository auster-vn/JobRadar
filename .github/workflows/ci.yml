name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: jobradarvn
          POSTGRES_USER: jobradarvn
          POSTGRES_PASSWORD: jobradarvn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobradarvn -d jobradarvn"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://jobradarvn:jobradarvn@localhost:5432/jobradarvn
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra analytics --extra ml --extra scraping
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy api nlp scrapers workers ml flows scripts
      - run: uv run python scripts/validate_skill_taxonomy.py
      - run: uv run python scripts/evaluate_skill_extractor.py --output artifacts/nlp/metrics.json
      - run: uv run alembic upgrade head
      - run: uv run python scripts/seed_ci_data.py
      - run: >-
          uv run python scripts/import_salary_snapshot.py
          data/vietjobs_it_salary_observations.csv
          data/topcv_2026_it_salary_observations.csv
          data/topcv_canhphu_2026_salary_observations.csv
          data/topcv_2026-07-19_it_salary_observations.csv
          data/topcv_operational_2026-07-18_salary_observations.csv
          data/vietnamworks_operational_2026-07-18_salary_observations.csv
      - run: uv run python scripts/backfill_job_experience.py
      - run: uv run python scripts/backfill_job_locations.py
      - run: uv run python scripts/backfill_job_titles.py
      - run: uv run pytest --cov=api --cov=nlp --cov=scrapers --cov=ml --cov-fail-under=70
      - run: uv run dbt deps --project-dir analytics --profiles-dir analytics
      - run: uv run dbt source freshness --project-dir analytics --profiles-dir analytics
        env:
          DBT_HOST: localhost
      - run: uv run dbt build --project-dir analytics --profiles-dir analytics
        env:
          DBT_HOST: localhost

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: jobradarvn
          POSTGRES_USER: jobradarvn
          POSTGRES_PASSWORD: jobradarvn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobradarvn -d jobradarvn"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://jobradarvn:jobradarvn@localhost:5432/jobradarvn
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync
      - run: uv run alembic upgrade head
      - run: uv run python scripts/seed_ci_data.py
      - run: >-
          uv run python scripts/import_salary_snapshot.py
          data/vietjobs_it_salary_observations.csv
          data/topcv_2026_it_salary_observations.csv
          data/topcv_canhphu_2026_salary_observations.csv
          data/topcv_2026-07-19_it_salary_observations.csv
          data/topcv_operational_2026-07-18_salary_observations.csv
          data/vietnamworks_operational_2026-07-18_salary_observations.csv
      - run: uv run python scripts/backfill_job_locations.py
      - name: Start API
        run: .venv/bin/uvicorn api.main:app --host 0.0.0.0 --port 8000 > /tmp/jobradar-api.log 2>&1 &
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Start web and wait for readiness
        run: |
          npm run start > /tmp/jobradar-web.log 2>&1 &
          for _ in {1..30}; do
            if curl --fail --silent http://localhost:8000/health/ready >/dev/null \
              && curl --fail --silent http://localhost:3000/salary >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/jobradar-api.log /tmp/jobradar-web.log
          exit 1
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results
          path: web/test-results
          if-no-files-found: ignore

  ml-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra ml
      - run: >-
          uv run pytest
          tests/unit/test_salary_training.py
          tests/unit/test_salary_artifacts.py
          tests/unit/test_salary_evaluate.py
          tests/unit/test_salary_evaluation_export.py
          tests/unit/test_salary_readiness.py
          tests/unit/test_ml_tasks.py

  ml-publication:
    runs-on: ubuntu-latest
    needs: ml-contract
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv sync
      - name: Enforce measured salary publication gate
        run: >-
          uv run python ml/salary/evaluate.py
          docs/evidence/salary_evaluation.json
          --require-data-ready
          --require-committed-revision

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.5
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform test
      - run: docker compose -f compose.yaml -f compose.collector.yaml config --quiet
      - name: Validate private self-hosted ingress
        env:
          DB_PASSWORD: compose-test-password
          JWT_SECRET_KEY: compose-test-jwt-secret
          ADMIN_API_KEY: compose-test-admin-key
          CV_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          GRAFANA_ADMIN_PASSWORD: compose-test-grafana
          DOMAIN: jobradar.test-tailnet.ts.net
          BACKEND_IMAGE: ghcr.io/auster-vn/jobradarvn-backend:test
          ML_IMAGE: ghcr.io/auster-vn/jobradarvn-ml:test
          WEB_IMAGE: ghcr.io/auster-vn/jobradarvn-web:test
        run: |
          set -euo pipefail
          config=$(mktemp)
          docker compose \
            -f compose.yaml \
            -f compose.production.yaml \
            -f compose.monitoring.yaml \
            -f compose.monitoring.production.yaml \
            -f compose.selfhost.yaml \
            config --format json > "$config"
          jq -e '
            (.services | has("caddy") | not) and
            ([.services | to_entries[] | select(.value.ports != null) | .key] == ["web"]) and
            (.services.web.ports | length == 1) and
            (.services.web.ports[0].host_ip == "127.0.0.1") and
            (.services.web.ports[0].published == "3000") and
            (.services.web.ports[0].target == 3000) and
            (.services.backup.user == "1000:1000") and
            (.services.backup.depends_on.migrate.condition == "service_completed_successfully") and
            ([.services[] | .logging.driver] | all(. == "local"))
          ' "$config"
      - run: python scripts/validate_monitoring.py
      - name: Validate Prometheus configuration
        run: >-
          docker run --rm --entrypoint /bin/promtool
          -v "$PWD/infra/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.12.0
          check config /etc/prometheus/prometheus.yml

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, ml-contract, infrastructure]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ml
          push: false
          cache-from: type=gha,scope=ml
          cache-to: type=gha,mode=max,scope=ml
