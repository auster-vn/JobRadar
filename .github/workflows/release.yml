name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  model:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: jobradarvn
          POSTGRES_USER: jobradarvn
          POSTGRES_PASSWORD: jobradarvn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobradarvn -d jobradarvn"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://jobradarvn:jobradarvn@localhost:5432/jobradarvn
      MLFLOW_TRACKING_URI: file:artifacts/mlruns
      SALARY_HOLDOUT_MANIFEST: data/salary_holdout_2026-07-19.json
      SOURCE_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv sync --extra ml
      - run: uv run alembic upgrade head
      - name: Import immutable salary snapshots
        run: >-
          uv run python scripts/import_salary_snapshot.py
          data/vietjobs_it_salary_observations.csv
          data/topcv_2026_it_salary_observations.csv
          data/topcv_canhphu_2026_salary_observations.csv
          data/topcv_2026-07-19_it_salary_observations.csv
          data/topcv_operational_2026-07-18_salary_observations.csv
          data/vietnamworks_operational_2026-07-18_salary_observations.csv
      - name: Train and verify release salary model
        run: uv run python scripts/train_salary_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: salary-model-${{ env.RELEASE_SHA }}
          path: artifacts/salary/current
          if-no-files-found: error
          retention-days: 7

  build:
    needs: model
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            file: Dockerfile
          - image: ml
            context: .
            file: Dockerfile.ml
          - image: web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/download-artifact@v7
        if: matrix.image == 'ml'
        with:
          name: salary-model-${{ env.RELEASE_SHA }}
          path: ml/model_seed/current
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Resolve image name
        shell: bash
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          echo "name=ghcr.io/$owner/jobradarvn-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ env.RELEASE_SHA }}
          build-args: SOURCE_REVISION=${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}
