name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            file: Dockerfile
          - image: ml
            context: .
            file: Dockerfile.ml
          - image: web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Resolve image name
        shell: bash
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          echo "name=ghcr.io/$owner/jobradarvn-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ env.RELEASE_SHA }}
          build-args: SOURCE_REVISION=${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/jobradarvn' }}
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
      DOMAIN: ${{ secrets.DOMAIN }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      CV_ENCRYPTION_KEY: ${{ secrets.CV_ENCRYPTION_KEY }}
      GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER || 'admin' }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ENABLE_ITVIEC_SCRAPER: ${{ vars.ENABLE_ITVIEC_SCRAPER || 'false' }}
      ENABLE_TOPCV_SCRAPER: ${{ vars.ENABLE_TOPCV_SCRAPER || 'false' }}
      ENABLE_VIETNAMWORKS_SCRAPER: ${{ vars.ENABLE_VIETNAMWORKS_SCRAPER || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - id: release
        name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${PRODUCTION_HOST:?PRODUCTION_HOST is required}"
          : "${PRODUCTION_USER:?PRODUCTION_USER is required}"
          : "${PRODUCTION_SSH_KEY:?PRODUCTION_SSH_KEY is required}"
          : "${PRODUCTION_KNOWN_HOSTS:?PRODUCTION_KNOWN_HOSTS is required}"
          : "${DOMAIN:?DOMAIN is required}"
          : "${DB_PASSWORD:?DB_PASSWORD is required}"
          : "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}"
          : "${ADMIN_API_KEY:?ADMIN_API_KEY is required}"
          : "${CV_ENCRYPTION_KEY:?CV_ENCRYPTION_KEY is required}"
          : "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}"
          (( ${#CV_ENCRYPTION_KEY} >= 32 ))
          [[ "$DEPLOY_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$ENABLE_ITVIEC_SCRAPER" =~ ^(true|false)$ ]]
          [[ "$ENABLE_TOPCV_SCRAPER" =~ ^(true|false)$ ]]
          [[ "$ENABLE_VIETNAMWORKS_SCRAPER" =~ ^(true|false)$ ]]
          for value in "$DB_PASSWORD" "$JWT_SECRET_KEY" "$ADMIN_API_KEY" \
            "$CV_ENCRYPTION_KEY" \
            "$GRAFANA_ADMIN_USER" "$GRAFANA_ADMIN_PASSWORD" \
            "$LINKEDIN_ACCESS_TOKEN" "$TELEGRAM_BOT_TOKEN" "$SMTP_HOST" \
            "$SMTP_PORT" "$SMTP_USER" "$SMTP_PASSWORD"; do
            [[ "$value" =~ ^[A-Za-z0-9._~@:/+-]*$ ]] || {
              echo "Deployment values must use URL-safe, newline-free characters" >&2
              exit 1
            }
          done
          owner=${GITHUB_REPOSITORY_OWNER,,}
          echo "image_prefix=ghcr.io/$owner/jobradarvn" >> "$GITHUB_OUTPUT"
          echo "target=$PRODUCTION_USER@$PRODUCTION_HOST" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload immutable release configuration
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$DEPLOY_ROOT/releases/$RELEASE_SHA"
          tar -czf /tmp/jobradar-release.tgz \
            compose.yaml compose.production.yaml compose.monitoring.yaml \
            compose.monitoring.production.yaml infra/caddy infra/prometheus infra/grafana \
            scripts/deploy_production.sh scripts/prune_production_releases.sh \
            scripts/production_smoke.sh scripts/backup_loop.sh
          # Paths expand on the runner after the validation step restricts their characters.
          # shellcheck disable=SC2029
          ssh "${{ steps.release.outputs.target }}" \
            "mkdir -p '$release_dir' && tar -xzf - -C '$release_dir'" \
            < /tmp/jobradar-release.tgz
          # shellcheck disable=SC2029
          {
            printf 'BACKEND_IMAGE=%s-backend:%s\n' '${{ steps.release.outputs.image_prefix }}' "$RELEASE_SHA"
            printf 'ML_IMAGE=%s-ml:%s\n' '${{ steps.release.outputs.image_prefix }}' "$RELEASE_SHA"
            printf 'WEB_IMAGE=%s-web:%s\n' '${{ steps.release.outputs.image_prefix }}' "$RELEASE_SHA"
            printf 'DOMAIN=%s\n' "$DOMAIN"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'JWT_SECRET_KEY=%s\n' "$JWT_SECRET_KEY"
            printf 'ADMIN_API_KEY=%s\n' "$ADMIN_API_KEY"
            printf 'CV_ENCRYPTION_KEY=%s\n' "$CV_ENCRYPTION_KEY"
            printf 'GRAFANA_ADMIN_USER=%s\n' "$GRAFANA_ADMIN_USER"
            printf 'GRAFANA_ADMIN_PASSWORD=%s\n' "$GRAFANA_ADMIN_PASSWORD"
            printf 'LINKEDIN_ACCESS_TOKEN=%s\n' "$LINKEDIN_ACCESS_TOKEN"
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n' "$SMTP_PORT"
            printf 'SMTP_USER=%s\n' "$SMTP_USER"
            printf 'SMTP_PASSWORD=%s\n' "$SMTP_PASSWORD"
            printf 'ENABLE_ITVIEC_SCRAPER=%s\n' "$ENABLE_ITVIEC_SCRAPER"
            printf 'ENABLE_TOPCV_SCRAPER=%s\n' "$ENABLE_TOPCV_SCRAPER"
            printf 'ENABLE_VIETNAMWORKS_SCRAPER=%s\n' "$ENABLE_VIETNAMWORKS_SCRAPER"
          } | ssh "${{ steps.release.outputs.target }}" \
            "umask 077; cat > '$release_dir/.env'"

      - name: Authenticate target to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The validated GitHub actor expands on the runner by design.
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh "${{ steps.release.outputs.target }}" \
            "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"

      - id: deploy
        name: Deploy release
        continue-on-error: true
        run: |
          # Validated release paths and SHA expand on the runner by design.
          # shellcheck disable=SC2029
          ssh "${{ steps.release.outputs.target }}" \
            "bash '$DEPLOY_ROOT/releases/$RELEASE_SHA/scripts/deploy_production.sh' deploy '$DEPLOY_ROOT' '$RELEASE_SHA'"

      - id: smoke
        name: Verify public production routes
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: bash scripts/production_smoke.sh "https://$DOMAIN"

      - name: Roll back failed release
        if: steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure'
        continue-on-error: true
        run: |
          # The validated deployment root expands on the runner by design.
          # shellcheck disable=SC2029
          ssh "${{ steps.release.outputs.target }}" \
            "bash '$DEPLOY_ROOT/current/scripts/deploy_production.sh' rollback '$DEPLOY_ROOT'"

      - name: Fail unsuccessful deployment
        if: steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure'
        run: exit 1

      - name: Prune old releases
        if: success()
        run: |
          # The validated deployment root expands on the runner by design.
          # shellcheck disable=SC2029
          ssh "${{ steps.release.outputs.target }}" \
            "bash '$DEPLOY_ROOT/current/scripts/prune_production_releases.sh' '$DEPLOY_ROOT' 5"

      - name: Remove registry credentials from target
        if: always()
        continue-on-error: true
        run: ssh "${{ steps.release.outputs.target }}" "docker logout ghcr.io"
