groups:
  - name: jobradar
    rules:
      - alert: ApiUnavailable
        expr: up{job="jobradar-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: JobRadar API is unavailable
      - alert: ApiP95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(jobradar_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API p95 latency exceeds 500 ms
      - alert: ApiErrorRateHigh
        expr: sum(rate(jobradar_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(jobradar_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: API 5xx rate exceeds 5 percent
      - alert: ScraperSilent
        expr: jobradar_last_successful_scrape_age_seconds > 172800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A scraper has not completed for 48 hours
      - alert: SalaryModelDrift
        expr: jobradar_salary_model_mape > 0.20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Salary model MAPE exceeds 20 percent
      - alert: QueueBacklog
        expr: jobradar_celery_queue_length > 500
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: A Celery queue has more than 500 pending tasks
